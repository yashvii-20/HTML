<html>
<head>
  <title>Multimedia Example</title>
</head>
<body style="font-family: Arial; text-align: center; background-color: #f2f2f2; padding: 20px;">

  <h1>Multimedia in HTML</h1>

  <h2>iFrame</h2>
  <iframe src="https://www.youtube.com/embed/lBvbNxiVmZA" width="600" height="400" style="border:2px solid black;"></iframe>

  <h2>Audio</h2>
  <audio controls>
    <source src="audio.mpeg" type="audio/mpeg">
  </audio>

  <!-- VIDEO -->
  <h2>Video Example</h2>
  <video width="600" height="500" controls>
    <source src="video.mp4" type="video/mp4">
  </video>

</body>
</html>
